services:
  - type: web
    name: muxlisa-verify
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: AUTHOR_CHAT_ID
        sync: false
